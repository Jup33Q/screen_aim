name: AimPhone
options:
  bundleIdPrefix: com.screenaim
targets:
  AimPhone:
    type: application
    platform: iOS
    # 传输层迁移（transport-26-plan）：TLV framer / NetworkConnection 新 API 需 iOS 26+
    #（ADR-011 ②：部署目标升 26.0，无双栈守卫；DockKit 下限 17 仍满足）
    deploymentTarget: "26.0"
    sources:
      - AimPhone
      # 纯 Swift 定位核（ArUco 检测 + 单应映射）：与 Mac 端 SwiftPM 共享同一份源码
      - path: ../Sources/ScreenAimCore
        name: ScreenAimCore
    info:
      path: AimPhone/Info.plist
      properties:
        NSCameraUsageDescription: "需要相机拍摄屏幕上的校准标记"
        NSLocalNetworkUsageDescription: "需要自动发现并连接局域网内的 Mac 传输画面"
        NSBonjourServices:
          - "_aimphone._tcp."
          # TLV 服务（新协议主路径，protocol.md §11；过渡期与旧服务并行）
          - "_aimphone2._tcp."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad 要求支持全部四个方向
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenaim.AimPhone
        # 真机部署：个人团队 yingyi gao
        DEVELOPMENT_TEAM: "4VF7272J66"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
